server.port=${PORT:8080}
spring.application.name=ai-asset-marketplace-api
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=health,info

payway.environment=${PAYWAY_ENVIRONMENT:sandbox}
payway.merchant-id=${PAYWAY_MERCHANT_ID:}
payway.api-key=${PAYWAY_API_KEY:}
payway.checkout-url=${PAYWAY_CHECKOUT_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase}
payway.qr-url=${PAYWAY_QR_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/generate-qr}
payway.check-url=${PAYWAY_CHECK_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/check-transaction-2}
payway.callback-url=${PAYWAY_CALLBACK_URL:https://ai-asset-marketplace-api.onrender.com/api/payway/callback}
